# 放在所选 Agent preset 的 config.plugins 列表内，替换原 compaction 组。
# 安装 bundle 只加载 uiOnly 展示；压缩引擎由用户自行接入 preset。
# 这是组片段，不是顶层 profile 补丁，也不是完整 preset 声明。
# 同一 scope 不要挂载第二个 compaction provider（如 compaction-basic）。
# tool-result-pruner 可选共存，DSH 提供运行包；不需要时可省略末尾 pruner row。
# 原位 release 在步骤边界独立生效；pruner 不代表语义释放，两者均不必生成摘要。
- id: compaction
  name: cordis:group
  group: true
  disabled: false
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: fold-context
      name: dsh-fold-context
      config:
        compaction:
          auto: true # false 关闭普通压力与 backlog 摘要；独立 release、溢出与显式请求仍可运行
          thresholdRatio: 0.8
          retainRatio: 0.16
          headroomTokens: 65536
        scheduling:
          enabled: true # false 使显式 context_compact 沿用旧的强制摘要路径
          proactive: true # false 只关闭低压力 queued-release backlog
          minIntervalSteps: 8
          minSavingsTokens: 2048
          minSavingsRatio: 0.2
          expectedSummaryRatio: 0.2
          paybackTurns: 8
          # HEURISTIC：归一化未缓存 token 成本，不是供应商费用或缓存 TTL。
          # 未知缓存保守假定前缀已缓存；实际压力/溢出与用户 /compact 绕过经济门槛。
          cacheReadRatio: 0.1
          summaryInputRatio: 1
          summaryOutputRatio: 1
        reminders:
          enabled: true
          minAgeSteps: 2 # 纯 context_* 管理步骤不推进计数
          largeOutputTokens: 8000 # 仅用于候选排序
          backlogTokens: 16000
          staleTokens: 4000
          staleSteps: 8
          pressureRatio: 0.8 # 相对于官方有效压力阈值
          minIntervalSteps: 6
          pressureIntervalSteps: 4
          ignoredBackoffSteps: [12, 24]
          rearmGrowthTokens: 8000
          maxCandidates: 5
        summary:
          reasoning: omit-from-summary
          images: auto # 能力未知或文本模型仅传引用；也可固定为 references
        release:
          catalogLimit: 32 # 按需目录 1–128；准入 notice 最多另附 8 条语义变化
    - id: command-compact
      name: "@deepseek-ai/dsh-command-compact"
    - id: tool-result-pruner
      name: "@deepseek-ai/dsh-compaction-tool-result-pruner"
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
