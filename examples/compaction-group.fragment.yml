# 放在所选 Agent preset 的 config.plugins 列表内，替换原 compaction 组。
# bundle 的根 uiOnly 条目同时提供插件页和 summaryModels 设置；引擎读取其最新列表。
# 摘要模型列表请在插件页设置，不在这个组片段内重复维护。
# 压缩引擎由用户自行接入 preset。
# 这是组片段，不是顶层 profile 补丁，也不是完整 preset 声明。
# 同一 scope 不要挂载第二个 compaction provider（如 compaction-basic）。
# tool-result-pruner 可选共存，DSH 提供运行包；不需要时可省略末尾 pruner row。
# 原位 release 在步骤边界独立生效；pruner 不代表语义释放，两者均不必生成摘要。
- id: compaction
  name: cordis:group
  group: true
  disabled: false
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: fold-context
      name: dsh-fold-context
      config:
        policy:
          compaction:
            auto: true # false 只停止无申请的常规主动摘要，保留排队申请和安全恢复
            cacheReadRatio: 0.1 # 缓存输入单价 / 未缓存输入单价
            summaryMaxTokens: 8192
            # targetTokens: 170000 # 可选绝对目标；省略时自动估算
            modelPolicies: [] # 可按 provider/model 覆盖目标和缓存比
          scheduling:
            summaryInputRatio: 1
            summaryOutputRatio: 1
            cacheTtlMs: 0 # 未知供应商 TTL 时保持关闭
          reminders:
            enabled: true
          summary:
            reasoning: omit-from-summary
            images: auto
    - id: command-compact
      name: "@deepseek-ai/dsh-command-compact"
    - id: tool-result-pruner
      name: "@deepseek-ai/dsh-compaction-tool-result-pruner"
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
