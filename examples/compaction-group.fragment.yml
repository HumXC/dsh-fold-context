# 自定义 Agent preset 的 plugins 列表中的一个组片段。
# 先把 dsh-fold-context 包安装到目标 profile，再替换原 compaction 组。
# 不要与 compaction-basic 或 tool-result-pruner 同时挂载。
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: fold-context
      name: dsh-fold-context
      config:
        compaction:
          auto: true # false 关闭普通压力与 backlog；仍保留实际溢出和显式模型请求
          thresholdRatio: 0.8
          retainRatio: 0.16
          headroomTokens: 65536
        scheduling:
          enabled: true # false 使显式 context_compact 沿用旧的强制摘要路径
          proactive: true # false 只关闭低压力 queued-release backlog
          minIntervalSteps: 8
          minSavingsTokens: 2048
          minSavingsRatio: 0.2
          expectedSummaryRatio: 0.2
          paybackTurns: 8
          # HEURISTIC：归一化未缓存 token 成本，不是供应商费用或缓存 TTL。
          # 未知缓存保守假定前缀已缓存；实际压力/溢出与用户 /compact 绕过经济门槛。
          cacheReadRatio: 0.1
          summaryInputRatio: 1
          summaryOutputRatio: 1
        summary:
          reasoning: omit-from-summary
          images: auto # 能力未知或文本模型仅传引用；也可固定为 references
        release:
          catalogLimit: 32 # 按需目录 1–128；准入 notice 最多另附 8 条语义变化
    - id: command-compact
      name: "@deepseek-ai/dsh-command-compact"
